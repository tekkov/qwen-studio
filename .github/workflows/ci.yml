name: CI 🧪

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The product and its integration tests are Windows-first: PowerShell is
    # part of the supported local toolchain, so verify on the real target OS.
    runs-on: windows-latest
    steps:
      - name: Check out the code 📦
        uses: actions/checkout@v4
      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run syntax checks and tests ✅
        run: npm run check
