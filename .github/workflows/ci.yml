name: CI 🧪

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code 📦
        uses: actions/checkout@v4
      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Set up Rust 🦀
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run syntax checks and tests ✅
        run: npm run check
      - name: Check native shell
        run: npm run check:native
      - name: Validate Tauri build
        run: npm run dist
