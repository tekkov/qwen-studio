[package]
name = "qwen-studio"
version = "0.4.3"
description = "A local-first Qwen coding agent desktop app powered by Ollama"
authors = ["Qwen Studio contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
